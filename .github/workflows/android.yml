name: APK Android
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Compilar (Kotlin nativo, estética Mochy)
        run: gradle :app:assembleRelease --no-daemon --stacktrace && mv app/build/outputs/apk/release/app-release.apk ../Rutas-0.2.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: Rutas-apk, path: "Rutas-*.apk" }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "v0.2.${{ github.run_number }}"
          name: "Rutas 0.2.${{ github.run_number }}"
          body: ${{ github.event.head_commit.message }}
          files: "Rutas-*.apk"
  capturas:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Capturas de pantalla (Robolectric)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas, path: app-android/app/build/capturas, if-no-files-found: ignore }
